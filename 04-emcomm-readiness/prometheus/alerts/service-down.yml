# Alert rules for service availability
groups:
  - name: service-availability
    interval: 30s
    rules:
      - alert: ServiceHighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High CPU on {{ $labels.instance }}"
          description: "CPU utilization above 90% for 5 minutes on {{ $labels.instance }}."

      - alert: MemoryCritical
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 2m
        labels:
          severity: critical
          category: performance
        annotations:
          summary: "Critical memory on {{ $labels.instance }}"
          description: "Available memory below 10% on {{ $labels.instance }}."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 10m
        labels:
          severity: warning
          category: storage
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Root filesystem has less than 15% free on {{ $labels.instance }}."
