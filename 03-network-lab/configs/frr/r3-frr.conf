! FRR Configuration — R3 (OSPF Area 1 — Cellular CPE Network)

frr version 9.1
frr defaults traditional
hostname r3
no ipv6 forwarding
!
interface eth1
 ip address 10.0.13.2/30
 ip ospf area 1
 ip ospf hello-interval 10
 ip ospf dead-interval 40
!
interface eth2
 ip address 10.0.23.2/30
 ip ospf area 1
!
interface eth3
 ip address 10.1.100.1/24
 ip ospf area 1
!
interface lo
 ip address 10.255.0.3/32
 ip ospf area 1
!
router ospf
 ospf router-id 10.255.0.3
 passive-interface eth3
 passive-interface lo
 log-adjacency-changes detail
!
line vty
!
