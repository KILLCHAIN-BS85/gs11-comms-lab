! FRR Configuration — R1 (OSPF Area 0 ABR)
! GS-11 Lab: Multi-area OSPF topology

frr version 9.1
frr defaults traditional
hostname r1
no ipv6 forwarding
!
interface eth1
 ip address 10.0.12.1/30
 ip ospf area 0
 ip ospf hello-interval 10
 ip ospf dead-interval 40
!
interface eth2
 ip address 10.0.13.1/30
 ip ospf area 1
!
interface lo
 ip address 10.255.0.1/32
 ip ospf area 0
!
router ospf
 ospf router-id 10.255.0.1
 area 1 stub
 passive-interface lo
 log-adjacency-changes detail
!
line vty
!
