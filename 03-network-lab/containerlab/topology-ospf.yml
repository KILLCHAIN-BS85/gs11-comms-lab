# Containerlab: FRR Multi-Area OSPF Topology
# Simulates the routing infrastructure behind cellular router CPE

name: gs11-ospf

topology:
  nodes:
    # ─── Core Routers (Area 0) ────────────────────────────────────
    r1:
      kind: linux
      image: frrouting/frr:9.1.0
      binds:
        - configs/frr/r1-frr.conf:/etc/frr/frr.conf
        - configs/frr/daemons:/etc/frr/daemons

    r2:
      kind: linux
      image: frrouting/frr:9.1.0
      binds:
        - configs/frr/r2-frr.conf:/etc/frr/frr.conf
        - configs/frr/daemons:/etc/frr/daemons

    # ─── Area 1 (Cellular CPE Network) ───────────────────────────
    r3:
      kind: linux
      image: frrouting/frr:9.1.0
      binds:
        - configs/frr/r3-frr.conf:/etc/frr/frr.conf
        - configs/frr/daemons:/etc/frr/daemons

    # ─── Endpoint hosts ───────────────────────────────────────────
    host1:
      kind: linux
      image: alpine:3.19
      exec:
        - ip addr add 10.1.100.10/24 dev eth1
        - ip route add default via 10.1.100.1

    host2:
      kind: linux
      image: alpine:3.19
      exec:
        - ip addr add 10.2.100.10/24 dev eth1
        - ip route add default via 10.2.100.1

  links:
    # Area 0 backbone
    - endpoints: [r1:eth1, r2:eth1]   # 10.0.12.0/30
    # R1 to Area 1
    - endpoints: [r1:eth2, r3:eth1]   # 10.0.13.0/30
    # R2 to Area 1
    - endpoints: [r2:eth2, r3:eth2]   # 10.0.23.0/30
    # Hosts
    - endpoints: [r3:eth3, host1:eth1]
    - endpoints: [r2:eth3, host2:eth1]
