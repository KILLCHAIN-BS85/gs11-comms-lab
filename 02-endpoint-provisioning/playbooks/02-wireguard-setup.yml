---
# Configure WireGuard VPN tunnels on endpoints
# Acts as the "secure comms channel" for cellular router simulation

- name: Configure WireGuard tunnels
  hosts: endpoints
  become: true

  vars:
    wg_interface: wg0
    wg_address_prefix: 10.99.0
    wg_config_dir: /etc/wireguard

  tasks:
    - name: Install WireGuard
      ansible.builtin.package:
        name: wireguard
        state: present

    - name: Generate WireGuard private key
      ansible.builtin.command: wg genkey
      register: wg_private_key
      changed_when: true

    - name: Derive public key
      ansible.builtin.shell: echo '{{ wg_private_key.stdout }}' | wg pubkey
      register: wg_public_key
      changed_when: false

    - name: Deploy WireGuard config
      ansible.builtin.template:
        src: ../templates/wg0.conf.j2
        dest: "{{ wg_config_dir }}/wg0.conf"
        mode: '0600'

    - name: Enable and start WireGuard
      ansible.builtin.systemd:
        name: wg-quick@wg0
        enabled: true
        state: started

    - name: Verify tunnel is up
      ansible.builtin.command: wg show wg0
      register: wg_status
      changed_when: false

    - name: Show WireGuard status
      ansible.builtin.debug:
        msg: "{{ wg_status.stdout_lines }}"
