---
# CIS-inspired baseline hardening for lab endpoints
# Replicates GS-11 security baseline enforcement

- name: Apply security hardening baseline
  hosts: all
  become: true

  tasks:
    - name: Disable unused protocols
      ansible.builtin.modprobe:
        name: "{{ item }}"
        state: absent
      loop:
        - dccp
        - sctp
        - rds
        - tipc

    - name: Set kernel hardening parameters (sysctl)
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_set: true
        state: present
        reload: true
      loop:
        - { key: 'net.ipv4.ip_forward',                   value: '0' }
        - { key: 'net.ipv4.conf.all.accept_redirects',    value: '0' }
        - { key: 'net.ipv4.conf.all.send_redirects',      value: '0' }
        - { key: 'net.ipv4.conf.all.rp_filter',           value: '1' }
        - { key: 'net.ipv4.tcp_syncookies',               value: '1' }
        - { key: 'kernel.dmesg_restrict',                 value: '1' }
        - { key: 'kernel.kptr_restrict',                  value: '2' }
        - { key: 'fs.protected_hardlinks',                value: '1' }
        - { key: 'fs.protected_symlinks',                 value: '1' }

    - name: Configure UFW default deny
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Allow WireGuard through firewall
      community.general.ufw:
        rule: allow
        port: '51820'
        proto: udp

    - name: Allow SSH (management only)
      community.general.ufw:
        rule: allow
        src: 192.168.10.0/24
        port: '22'
        proto: tcp

    - name: Ensure auditd is installed and running
      ansible.builtin.package:
        name: auditd
        state: present

    - name: Enable auditd
      ansible.builtin.systemd:
        name: auditd
        enabled: true
        state: started
