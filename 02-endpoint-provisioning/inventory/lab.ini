[all:vars]
ansible_user=labadmin
ansible_ssh_private_key_file=~/.ssh/lab_key
ansible_python_interpreter=/usr/bin/python3

[endpoints]
# Simulated cellular router endpoints (VMs)
cpe-01 ansible_host=192.168.10.11 device_role=cpe    device_id=CPE-001
cpe-02 ansible_host=192.168.10.12 device_role=cpe    device_id=CPE-002
iop-01 ansible_host=192.168.10.21 device_role=iot    device_id=IOT-001

[servers]
# Lab infrastructure
monitoring ansible_host=192.168.10.100 device_role=server  device_id=MON-001
pki-ca      ansible_host=192.168.10.101 device_role=server  device_id=PKI-001

[endpoints:vars]
wireguard_server_ip=10.99.0.1
wireguard_port=51820
dns_servers=["10.99.0.1", "1.1.1.1"]
cert_validity=8760h   # 1 year

[servers:vars]
wireguard_server_ip=10.99.0.1
