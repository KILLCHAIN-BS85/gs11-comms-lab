# Open5GS AMF Configuration
# Access and Mobility Management Function

logger:
  file:
    path: /var/log/open5gs/amf.log
  level: info

global:
  max:
    ue: 1024
    peer: 64

amf:
  sbi:
    server:
      - address: amf
        port: 7777
    client:
      nrf:
        - uri: http://nrf:7777

  ngap:
    server:
      - address: amf   # N2 interface toward gNB

  guami:
    - plmn_id:
        mcc: 001
        mnc: 01
      amf_id:
        region: 2
        set: 1

  tai:
    - plmn_id:
        mcc: 001
        mnc: 01
      tac: 1

  plmn_support:
    - plmn_id:
        mcc: 001
        mnc: 01
      s_nssai:
        - sst: 1          # eMBB slice
        - sst: 2          # URLLC slice

  security:
    integrity_order: [NIA2, NIA1, NIA0]
    ciphering_order: [NEA0, NEA2, NEA1]

  network_name:
    full: GS11-Lab
    short: GS11
